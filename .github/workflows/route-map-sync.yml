name: route-map-sync

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact Mash candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact Mash candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Check out exact route-map proposal
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hacker-house-medellin/hhm-lib-core
          ref: 76f1f1720ebabf7c3b860bf6f092c5564e431f83
          path: hhm-lib-core
          persist-credentials: false
      - name: Verify route-map proposal identity
        working-directory: hhm-lib-core
        run: test "$(git rev-parse HEAD)" = "76f1f1720ebabf7c3b860bf6f092c5564e431f83"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate Mash route map against source
        run: >-
          python3 scripts/check-route-sync.py
          --root .
          --map hhm-lib-core/route-maps/mash.route-map.json
          --source src
          --allow-docs-merge
          --skip-drift
