[package]
name = "hhm-mash-lambdas"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
publish = false

[dependencies]
hhm-contracts = { git = "https://github.com/hacker-house-medellin/hhm-lib-core", rev = "86dec33bd7558c38a370fa21333ab861e8b279d9", package = "hhm-contracts" }
lambda_http = { version = "=1.3.1", default-features = false, features = ["apigw_http", "tracing"] }
maud = "=0.27.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "hhm-occupancy-report"
path = "src/bin/report.rs"

[[bin]]
name = "hhm-roster-export"
path = "src/bin/export.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"
